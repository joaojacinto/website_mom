<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose a new password | Allys's 3D Design</title></head>
<body style="margin:0; min-height:100vh; display:grid; place-items:center; background:#101918; color:#edf8f5; font:16px Arial,sans-serif;">
  <main style="width:min(420px,calc(100% - 40px)); padding:32px; border:1px solid #31504c; border-radius:12px; background:#172321;">
    <h1 style="color:#01d9c4;">Choose a new password</h1>
    {% if validlink %}
      <p>Escolha uma nova palavra-passe para a sua conta de administração.</p>
      <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" style="padding:12px 18px; border:0; border-radius:6px; background:#01d9c4; font-weight:700;">Save password / Guardar</button></form>
    {% else %}
      <p>This reset link is invalid or has expired.</p>
      <p>Este link é inválido ou já expirou. Peça um novo link de recuperação.</p>
    {% endif %}
  </main>
</body>
</html>
