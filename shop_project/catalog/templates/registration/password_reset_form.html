<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | Allys's 3D Design</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101918; color: #edf8f5; font: 16px Arial, sans-serif; }
    main { width: min(420px, calc(100% - 40px)); padding: 32px; border: 1px solid #31504c; border-radius: 12px; background: #172321; }
    h1 { margin-top: 0; color: #01d9c4; } label { display: block; margin: 20px 0 8px; } input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #55716c; border-radius: 6px; background: #0d1413; color: inherit; } button { margin-top: 20px; padding: 12px 18px; border: 0; border-radius: 6px; background: #01d9c4; color: #10201e; font-weight: 700; cursor: pointer; } .help { color: #b7ccc8; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <p class="help">Enter your admin account email to receive a password reset link.</p>
    <p class="help">Introduza o email da sua conta de administração para receber um link de recuperação.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.email.errors }}
      <label for="{{ form.email.id_for_label }}">Email</label>
      {{ form.email }}
      <button type="submit">Send reset link / Enviar link</button>
    </form>
  </main>
</body>
</html>
